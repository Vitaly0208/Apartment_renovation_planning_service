<article class="card room-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ room.name|default:"Без названия" }}
        </h2>
        <p class="card-text">
            Площадь пола: {{ room.calculate_floor_area }} кв.м
        </p>
        <p class="card-text">
            Площадь стен: {{ room.calculate_wall_area }} кв.м
        </p>
        <a href="{% url 'rooms:room_detail' room.id %}"
           class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>
