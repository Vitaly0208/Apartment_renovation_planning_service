<article class="card estimate-card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h5 class="card-title mb-1">
                <a href="{% url 'estimates:estimate_detail' estimate.id %}">
                    №{{ estimate.id }}: {{ estimate.user.name }} → {{ estimate.room.name }}
                </a>
            </h5>
            <p class="card-text mb-0">
                Итого: {{ estimate.total }} руб.
            </p>
        </div>
        <span class="badge bg-primary rounded-pill">
            {{ estimate.total }} руб.
        </span>
    </div>
</article>
