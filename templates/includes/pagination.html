{% if page_obj.has_other_pages %}
<nav aria-label="Страницы смет">
    {% if page_obj.has_previous %}
    <a href="{% querystring page=1 %}">Первая</a>
    <a href="{% querystring page=page_obj.previous_page_number %}">Предыдущая</a>
    {% endif %}
    <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}">Следующая</a>
    <a href="{% querystring page=page_obj.paginator.num_pages %}">Последняя</a>
    {% endif %}
</nav>
{% endif %}
