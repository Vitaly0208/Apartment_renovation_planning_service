{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}РемонтПлан{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}

    <main class="container">
        {% for message in messages %}<div class="alert alert-info" role="status">{{ message }}</div>{% endfor %}
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p>© <span id="current-year"></span> {{ site_name }} · Помещений: {{ rooms_count }}</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
